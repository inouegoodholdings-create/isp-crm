let _dateFilterVisible = false;
function toggleDateFilter(prodId) {
  _dateFilterVisible = !_dateFilterVisible;
  const row = document.getElementById('date-filter-row');
  if (row) row.style.display = _dateFilterVisible ? 'flex' : 'none';
}

function clearFilters(prodId) {
  ['cust-search','cust-date-from','cust-date-to'].forEach(id => {
    const el = document.getElementById(id); if (el) el.value = '';
  });
  ['cust-status','cust-staff'].forEach(id => {
    const el = document.getElementById(id); if (el) el.selectedIndex = 0;
  });
  custFilter = { keyword: '', status: '', staff: '', dateFrom: '', dateTo: '', page: 1 };
  renderCustomerTable(prodId);
}



function applyFilters(custs) {
  // AND検索（スペース区切り）
  if (custFilter.keyword) {
    const terms = custFilter.keyword.split(/\s+/).filter(Boolean);
    custs = custs.filter(c => {
      const hay = Object.entries(c).filter(([k])=>!k.startsWith('_')).map(([,v])=>String(v||'')).join(' ').toLowerCase()
        + ' ' + [c._顧客名||'',c._担当者||'',c._ステータス||''].join(' ').toLowerCase();
      return terms.every(t => hay.includes(t));
    });
  }
  // ステータス複数選択
  if (custFilter.statuses && custFilter.statuses.length > 0) {
    custs = custs.filter(c => custFilter.statuses.includes(c._ステータス));
  }
  if (custFilter.staff)    custs = custs.filter(c => c._担当者 === custFilter.staff);
  // 日付絞込（指定列で）
  const dateKey = custFilter.dateCol || '_申込日';
  if (custFilter.dateFrom) custs = custs.filter(c => {
    const val = (c[dateKey]||'').slice(0,10);
    return val >= custFilter.dateFrom;
  });
  if (custFilter.dateTo) custs = custs.filter(c => {
    const val = (c[dateKey]||'').slice(0,10);
    return val <= custFilter.dateTo;
  });
  // フラグ絞込
  if (custFilter.flagOnly) custs = custs.filter(c => c._flagged);
  return custs;
}

// filterCustomers を強化版に置き換え
function filterCustomers(prodId) {
  custFilter.keyword  = document.getElementById('cust-search')?.value.toLowerCase().trim() || '';
  custFilter.staff    = document.getElementById('cust-staff')?.value || '';
  custFilter.dateFrom = document.getElementById('cust-date-from')?.value || '';
  custFilter.dateTo   = document.getElementById('cust-date-to')?.value || '';
  custFilter.dateCol  = document.getElementById('cust-date-col')?.value || '_申込日';
  // ステータス複数選択
  const checks = document.querySelectorAll('.status-check:checked');
  custFilter.statuses = [...checks].map(el => el.value);
  // ステータスバッジ件数更新
  const cnt = document.getElementById('status-filter-count');
  if (cnt) {
    cnt.textContent = custFilter.statuses.length;
    cnt.style.display = custFilter.statuses.length > 0 ? 'inline' : 'none';
  }
  custFilter.page = 1;
  renderCustomerTable(prodId);
}

function renderCustomerTable(prodId) {
  const prod = state.products.find(p => p.id === prodId);
  if (!prod) return;

  let custs = applyFilters(state.customers.filter(c => c._productId === prodId));
  const total = custs.length;
  const pages = Math.ceil(total / PAGE_SIZE) || 1;
  const page  = Math.min(custFilter.page, pages);
  const slice = custs.slice((page-1)*PAGE_SIZE, page*PAGE_SIZE);

  // 表示列：マッピング済み列を最大6列
  const mapping = prod.columnMapping || {};
  const vis = prod._colVisibility || {};
  const allMapped = Object.entries(mapping).filter(([,v]) => v).map(([k,v]) => ({ key:k, col:v }));
  const dispCols = allMapped.filter(c => vis[c.key] !== false).slice(0, 8);

  const statusColors = {
    '完了':'badge-green','開通済':'badge-green','工事完了':'badge-green','納品済':'badge-green','契約済':'badge-green','サービス開始':'badge-green','成約':'badge-green','来店済':'badge-green','入金済':'badge-green',
    'キャンセル':'badge-red','解約':'badge-red','中止':'badge-red','失注':'badge-red','見送り':'badge-red','NG':'badge-red',
    '受付':'badge-blue','商談中':'badge-blue','申込':'badge-blue','受注':'badge-blue','提案中':'badge-blue',
    '調整中':'badge-yellow','工事日調整中':'badge-yellow','審査中':'badge-yellow','保留':'badge-yellow','更新待ち':'badge-yellow',
  };

  const thead = `<tr>
    <th style="width:40px;"><input type="checkbox" id="check-all" onchange="toggleAllCheck('${prodId}')" style="accent-color:var(--accent);width:14px;height:14px;"></th>
    ${dispCols.map(c => `<th style="cursor:pointer;" onclick="sortBy('${prodId}','${c.key}')">${escHtml(c.col)} <span style="color:var(--text3);font-size:10px;">↕</span></th>`).join('')}
    <th>操作</th>
  </tr>`;

  const tbody = slice.length === 0
    ? `<tr><td colspan="${dispCols.length + 2}" style="text-align:center;padding:48px;color:var(--text3);">
        <div style="font-size:32px;margin-bottom:8px;">🔍</div>
        該当するデータがありません
      </td></tr>`
    : slice.map(c => {
        const statusBadge = c._ステータス
          ? `<span class="badge ${statusColors[c._ステータス]||'badge-gray'}">${escHtml(c._ステータス)}</span>`
          : '—';
        return `<tr id="row-${c._id}">
          <td><input type="checkbox" class="row-check" data-id="${c._id}" style="accent-color:var(--accent);width:14px;height:14px;"></td>
          ${dispCols.map(col => {
            const val = String(c[col.key] || c[col.col] || '');
            if (col.key === '_ステータス') return `<td>${statusBadge}</td>`;
            return `<td title="${escHtml(val)}" style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escHtml(val)||'—'}</td>`;
          }).join('')}
          <td style="white-space:nowrap;">
            <button class="btn btn-ghost btn-sm" style="padding:4px 6px;font-size:16px;color:${c._flagged ? 'var(--warning)' : 'var(--text3)'};" onclick="event.stopPropagation();toggleFlag('${c._id}','${prodId}')" title="${c._flagged ? 'フラグを外す' : 'フラグを立てる'}">${c._flagged ? '⭐' : '☆'}</button>
            <button class="btn btn-ghost btn-sm" style="padding:4px 6px;font-size:14px;" onclick="event.stopPropagation();openMemoModal('${c._id}','${prodId}')" title="メモ${(c._memos&&c._memos.length)?'('+c._memos.length+')':''}">💬${c._memos&&c._memos.length?`<span style="font-size:9px;color:var(--accent);">${c._memos.length}</span>`:''}</button>
            <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openEditCustomer('${c._id}','${prodId}')">編集</button>
            <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openCustomerDrawer('${c._id}','${prodId}')">詳細</button>
            <button class="btn btn-ghost btn-sm" style="color:var(--danger);" onclick="event.stopPropagation();deleteCustomer('${c._id}','${prodId}')">削除</button>
          </td>
        </tr>`;
      }).join('');

  document.getElementById('cust-table-wrap').innerHTML = `
    <div id="bulk-actions" style="display:none;padding:10px 16px;background:var(--accent-light);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;">
      <span id="bulk-count" style="font-size:13px;font-weight:600;color:var(--accent);"></span>
      <button class="btn btn-secondary btn-sm" onclick="bulkStatusChange('${prodId}')">ステータス一括変更</button>
      <button class="btn btn-danger btn-sm" onclick="bulkDelete('${prodId}')">一括削除</button>
      <button class="btn btn-secondary btn-sm" onclick="exportCSVFiltered('${prodId}',true)">選択行をCSV出力</button>
    </div>
    <div class="table-wrap"><table><thead>${thead}</thead><tbody>${tbody}</tbody></table></div>`;

  // チェックボックスのイベント
  document.querySelectorAll('.row-check').forEach(cb => {
    cb.addEventListener('change', () => updateBulkBar(prodId));
  });

  // ページネーション
  const pag = document.getElementById('cust-pagination');
  if (pag) {
    const start = total === 0 ? 0 : (page-1)*PAGE_SIZE+1;
    const end   = Math.min(page*PAGE_SIZE, total);
    const pageNums = [];
    for (let p = Math.max(1,page-2); p <= Math.min(pages,page+2); p++) pageNums.push(p);
    pag.innerHTML = `
      <span style="font-size:12px;color:var(--text3);margin-right:4px;">${total}件中 ${start}〜${end}件表示</span>
      <button class="btn btn-secondary btn-sm" ${page<=1?'disabled':''} onclick="custFilter.page=1;renderCustomerTable('${prodId}')">«</button>
      <button class="btn btn-secondary btn-sm" ${page<=1?'disabled':''} onclick="custFilter.page=${page-1};renderCustomerTable('${prodId}')">‹</button>
      ${pageNums.map(n => `<button class="btn ${n===page?'btn-primary':'btn-secondary'} btn-sm" onclick="custFilter.page=${n};renderCustomerTable('${prodId}')">${n}</button>`).join('')}
      <button class="btn btn-secondary btn-sm" ${page>=pages?'disabled':''} onclick="custFilter.page=${page+1};renderCustomerTable('${prodId}')">›</button>
      <button class="btn btn-secondary btn-sm" ${page>=pages?'disabled':''} onclick="custFilter.page=${pages};renderCustomerTable('${prodId}')">»</button>
      <select class="form-control" style="width:70px;font-size:12px;padding:4px 6px;" onchange="custFilter.page=parseInt(this.value);renderCustomerTable('${prodId}')">
        ${pageNums.map(n => `<option value="${n}" ${n===page?'selected':''}>${n}P</option>`).join('')}
      </select>`;
  }
}

// ===== ソート =====
let _sortKey = '', _sortAsc = true;
function sortBy(prodId, key) {
  if (_sortKey === key) _sortAsc = !_sortAsc; else { _sortKey = key; _sortAsc = true; }
  state.customers.sort((a, b) => {
    if (a._productId !== prodId || b._productId !== prodId) return 0;
    const av = String(a[key]||''), bv = String(b[key]||'');
    return _sortAsc ? av.localeCompare(bv,'ja') : bv.localeCompare(av,'ja');
  });
  custFilter.page = 1;
  renderCustomerTable(prodId);
}

// ===== チェック・一括操作 =====
function toggleAllCheck(prodId) {
  const all = document.getElementById('check-all')?.checked;
  document.querySelectorAll('.row-check').forEach(cb => cb.checked = !!all);
  updateBulkBar(prodId);
}
function getCheckedIds() {
  return [...document.querySelectorAll('.row-check:checked')].map(cb => cb.dataset.id);
}
function updateBulkBar(prodId) {
  const ids = getCheckedIds();
  const bar = document.getElementById('bulk-actions');
  const cnt = document.getElementById('bulk-count');
  if (bar) bar.style.display = ids.length > 0 ? 'flex' : 'none';
  if (cnt) cnt.textContent = `${ids.length}件選択中`;
}
function bulkDelete(prodId) {
  const ids = getCheckedIds();
  if (!ids.length) return;
  if (!confirm(`${ids.length}件を削除しますか？`)) return;
  state.customers = state.customers.filter(c => !ids.includes(c._id));
  saveState(); renderCustomerTable(prodId);
  showToast(`${ids.length}件を削除しました`, 'success');
}
function bulkStatusChange(prodId) {
  const ids = getCheckedIds();
  if (!ids.length) return;
  const prod = state.products.find(p => p.id === prodId);
  const opts = (prod.statusValues||[]).map(s => `<option>${escHtml(s)}</option>`).join('');
  showModal('ステータスを一括変更', `
    <p style="font-size:13px;color:var(--text2);margin-bottom:12px;">${ids.length}件のステータスを変更します。</p>
    <div class="form-group">
      <label class="form-label">変更後のステータス</label>
      <select class="form-control" id="bulk-status-val">${opts}</select>
    </div>`, [
    { label:'キャンセル', cls:'btn-secondary', action: closeModal },
    { label:'変更する', cls:'btn-primary', action: () => {
      const val = document.getElementById('bulk-status-val').value;
      ids.forEach(id => { const c = state.customers.find(c => c._id === id); if (c) c._ステータス = val; });
      saveState(); closeModal(); renderCustomerTable(prodId);
      showToast(`${ids.length}件のステータスを「${val}」に変更しました`, 'success');
    }}
  ], 'modal-sm');
}

// ===== 顧客編集（インライン） =====
function openEditCustomer(custId, prodId) {
  const cust = state.customers.find(c => c._id === custId);
  const prod = state.products.find(p => p.id === prodId);
  if (!cust || !prod) return;
  const mapping = prod.columnMapping || {};
  const fields = prod.formFields && prod.formFields.length
    ? prod.formFields
    : Object.entries(mapping).filter(([,v])=>v).map(([k,v]) => ({ id:k, mapKey:k, label:v, type:'text', required:false, choices:[] }));

  const formHtml = fields.map(f => {
    const val = escHtml(String(cust[f.mapKey] || cust[f.label] || ''));
    const id  = `edit-${f.id}`;
    let inp = '';
    if (f.type==='select'||f.type==='radio') {
      const opts = ['<option value="">選択</option>', ...(f.choices||[]).map(c => `<option value="${escHtml(c)}" ${val===c?'selected':''}>${escHtml(c)}</option>`)].join('');
      inp = `<select class="form-control" id="${id}">${opts}</select>`;
    } else if (f.type==='textarea') {
      inp = `<textarea class="form-control" id="${id}" rows="2">${val}</textarea>`;
    } else if (f.type==='checkbox') {
      const checked = val.split(',').map(s=>s.trim());
      inp = `<div style="display:flex;flex-wrap:wrap;gap:6px;">${(f.choices||[]).map(c=>`<label style="display:flex;align-items:center;gap:4px;font-size:12px;"><input type="checkbox" value="${escHtml(c)}" ${checked.includes(c)?'checked':''} style="accent-color:var(--accent);">${escHtml(c)}</label>`).join('')}</div>`;
    } else {
      inp = `<input type="${f.type||'text'}" class="form-control" id="${id}" value="${val}">`;
    }
    return `<div class="form-group"><label class="form-label">${escHtml(f.label)}</label>${inp}</div>`;
  }).join('');

  showModal(`編集 - ${escHtml(cust._顧客名||'顧客')}`, `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 16px;">${formHtml}</div>`,
  [
    { label:'キャンセル', cls:'btn-secondary', action: closeModal },
    { label:'保存',       cls:'btn-primary',   action: () => {
      fields.forEach(f => {
        const id = `edit-${f.id}`;
        let val = '';
        if (f.type==='checkbox') {
          val = [...document.querySelectorAll(`#modal-box [id^="edit-"][type="checkbox"]:checked`)].filter(el=>el.closest('.form-group')===document.getElementById(id)?.closest('.form-group')).map(el=>el.value).join(', ');
          // simpler approach
          val = [...document.querySelectorAll(`[id="${id}"] ~ div input[type=checkbox]:checked, [id="${id}"] input[type=checkbox]:checked`)]
            .map(el=>el.value).join(', ') ||
            [...document.querySelectorAll(`#modal-box .form-group:has(#${id}) input[type=checkbox]:checked`)]
            .map(el=>el.value).join(', ');
          // fallback: direct
          const el2 = document.getElementById(id)?.parentElement?.querySelectorAll('input[type=checkbox]:checked');
          if (el2) val = [...el2].map(el=>el.value).join(', ');
        } else {
          const el = document.getElementById(id); val = el ? el.value.trim() : '';
        }
        if (f.mapKey) cust[f.mapKey] = val;
        cust[f.label] = val;
      });
      // ステータス・スタッフキャッシュを更新
      if (cust._ステータス && !prod.statusValues.includes(cust._ステータス)) prod.statusValues.push(cust._ステータス);
      if (cust._担当者    && !prod.staffValues.includes(cust._担当者))     prod.staffValues.push(cust._担当者);
      saveState(); closeModal(); renderCustomerTable(prodId);
      showToast('更新しました', 'success');
    }}
  ], 'modal-lg');
}

// ===== 顧客詳細ドロワー =====
function openCustomerDrawer(custId, prodId) {
  const cust = state.customers.find(c => c._id === custId);
  const prod = state.products.find(p => p.id === prodId);
  if (!cust || !prod) return;

  const overlay = document.createElement('div');
  overlay.className = 'drawer-overlay';
  overlay.onclick = () => { overlay.remove(); drawer.remove(); };

  const drawer = document.createElement('div');
  drawer.className = 'drawer';
  const mapping = prod.columnMapping || {};

  const stdFields = Object.entries(mapping).filter(([,v])=>v).map(([k,v]) => `
    <div class="detail-row">
      <div class="detail-label">${escHtml(v)}</div>
      <div class="detail-value">${escHtml(String(cust[k]||cust[v]||'—'))}</div>
    </div>`).join('');

  const rawFields = Object.entries(cust).filter(([k])=>!k.startsWith('_')).map(([k,v]) => `
    <div class="detail-row">
      <div class="detail-label" style="font-size:10px;">${escHtml(k)}</div>
      <div class="detail-value"  style="font-size:12px;">${escHtml(String(v||'—'))}</div>
    </div>`).join('');

  const dupCount = state.customers.filter(c => c._productId === prodId && c._id !== custId &&
    c._顧客名 && cust._顧客名 && c._顧客名 === cust._顧客名).length;

  drawer.innerHTML = `
    <div class="drawer-header">
      <div>
        <div class="drawer-title">${escHtml(cust._顧客名||'顧客詳細')}</div>
        ${dupCount > 0 ? `<div style="font-size:11px;color:var(--danger);margin-top:2px;">⚠️ 同名の顧客が${dupCount}件あります</div>` : ''}
      </div>
      <button class="modal-close" onclick="this.closest('.drawer').previousSibling.remove();this.closest('.drawer').remove()">×</button>
    </div>
    <div class="drawer-body">
      <div style="display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;">
        <button class="btn btn-primary btn-sm" onclick="openEditCustomer('${custId}','${prodId}')">✏️ 編集</button>
        <button class="btn btn-secondary btn-sm" onclick="openMemoModal('${custId}','${prodId}')">💬 メモ${cust._memos&&cust._memos.length?'('+cust._memos.length+')':''}</button>
        <button class="btn btn-secondary btn-sm" onclick="openHistoryModal('${custId}')">📋 変更履歴</button>
        <button class="btn btn-secondary btn-sm" onclick="printCustomerDetail('${custId}','${prodId}')">🖨️ 印刷</button>
        <button class="btn btn-danger btn-sm" onclick="deleteCustomer('${custId}','${prodId}')">削除</button>
      </div>
      <div class="tabs" id="drawer-tabs">
        <button class="tab active" onclick="switchDrawerTab(0)">基本情報</button>
        <button class="tab" onclick="switchDrawerTab(1)">全項目</button>
      </div>
      <div id="drawer-tab-0">${stdFields||'<div class="text-muted" style="padding:20px 0;">マッピング設定がありません</div>'}</div>
      <div id="drawer-tab-1" style="display:none;">${rawFields}</div>
    </div>`;

  document.body.appendChild(overlay);
  document.body.appendChild(drawer);
}

function switchDrawerTab(idx) {
  [0,1].forEach(i => {

  });

// ===== CSV出力（フィルター後・選択行） =====
function exportCSVFiltered(prodId, selectedOnly = false) {
  const prod = state.products.find(p => p.id === prodId);
  let custs;
  if (selectedOnly) {
    const ids = new Set(getCheckedIds());
    custs = state.customers.filter(c => c._productId === prodId && ids.has(c._id));
  } else {
    custs = applyFilters(state.customers.filter(c => c._productId === prodId));
  }
  if (!custs.length) { showToast('出力対象がありません', 'error'); return; }

  // マッピング列 + 全列
  const mapping  = prod.columnMapping || {};
  const mapCols  = Object.entries(mapping).filter(([,v])=>v).map(([k,v]) => ({ key:k, header:v }));
  const rawCols  = [...new Set(custs.flatMap(c => Object.keys(c).filter(k => !k.startsWith('_'))))];

  const headers = [...mapCols.map(c=>c.header), ...rawCols.filter(r => !mapCols.some(m=>m.header===r))];
  const rows    = custs.map(c => headers.map((h,i) => {
    if (i < mapCols.length) return String(c[mapCols[i].key] || c[mapCols[i].header] || '');
    return String(c[h] || '');
  }));

  const lines = [headers, ...rows].map(r => r.map(v => `"${v.replace(/"/g,'""')}"`).join(','));
  const blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const suffix = selectedOnly ? '_選択行' : (custFilter.keyword || custFilter.status || custFilter.staff ? '_絞込済' : '');
  a.download = `${prod.name}${suffix}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  showToast(`${custs.length}件をCSV出力しました`, 'success');
}

// ===== 重複チェック =====
function checkDuplicates(prodId) {
  const custs = state.customers.filter(c => c._productId === prodId);
  const nameMap = {};
  custs.forEach(c => {
    const name = (c._顧客名||'').trim();
    if (!name) return;
    if (!nameMap[name]) nameMap[name] = [];
    nameMap[name].push(c);
  });
  const dups = Object.entries(nameMap).filter(([,arr]) => arr.length > 1);

  if (!dups.length) { showToast('重複データはありませんでした ✅', 'success'); return; }

  const rows = dups.slice(0,50).map(([name, arr]) => `
    <tr style="background:var(--warning-light);">
      <td><b>${escHtml(name)}</b></td>
      <td style="text-align:center;"><span class="badge badge-yellow">${arr.length}件</span></td>
      <td>${arr.map(c => escHtml(c._申込日||'')).join(' / ')}</td>
      <td>${arr.map(c => escHtml(c._担当者||'')).join(' / ')}</td>
      <td>${arr.map(c => `<button class="btn btn-ghost btn-sm" onclick="openCustomerDrawer('${c._id}','${prodId}')">確認</button>`).join('')}</td>
    </tr>`).join('');

  showModal(`重複チェック結果 - ${dups.length}件の重複`, `
    <div style="font-size:13px;color:var(--text2);margin-bottom:12px;">同じ顧客名で複数のデータが登録されています。</div>
    <div class="table-wrap" style="max-height:400px;overflow-y:auto;">
      <table><thead><tr><th>顧客名</th><th>件数</th><th>申込日</th><th>担当者</th><th>確認</th></tr></thead>
      <tbody>${rows}</tbody></table>
    </div>
  `, [{ label:'閉じる', cls:'btn-secondary', action:closeModal }], 'modal-lg');
}

function setDatePreset(prodId, preset) {
  const now = new Date();
  let from = '', to = '';
  if (preset === 'thisMonth') {
    from = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
    to   = new Date(now.getFullYear(), now.getMonth()+1, 0).toISOString().slice(0,10);
  } else if (preset === 'lastMonth') {
    const d = new Date(now.getFullYear(), now.getMonth()-1, 1);
    from = d.toISOString().slice(0,10);
    to   = new Date(now.getFullYear(), now.getMonth(), 0).toISOString().slice(0,10);
  } else if (preset === 'last30') {
    const d = new Date(now); d.setDate(d.getDate()-30);
    from = d.toISOString().slice(0,10);
    to   = now.toISOString().slice(0,10);
  }
  const fromEl = document.getElementById('cust-date-from');
  const toEl   = document.getElementById('cust-date-to');
  if (fromEl) fromEl.value = from;
  if (toEl)   toEl.value   = to;

  updateDateActiveIndicator();
}

// ============================================================
// ダッシュボードアラート
// ============================================================
function getAlerts() {
  const today = new Date().toISOString().slice(0,10);
  const alerts = [];
  state.customers.forEach(c => {
    const prod = state.products.find(p => p.id === c._productId);
    const prodName = prod ? prod.name : '';
    // 今日が工事・納品日
    if (c._完了日 === today) {
      alerts.push({ type:'today', label:'本日完了予定', cust:c, prodName });
    }
    // 過去の完了日が未完了（期限切れ）
    const completedSet = new Set(['完了','開通済','工事完了','納品済','契約済','サービス開始','成約','入金済','キャンセル','解約','失注']);
    if (c._完了日 && c._完了日 < today && !completedSet.has(c._ステータス||'')) {
      alerts.push({ type:'overdue', label:'期限切れ', cust:c, prodName });
    }
    // フラグ付き
    if (c._flagged) {
      alerts.push({ type:'flag', label:'フォロー中', cust:c, prodName });
    }
  });
  return alerts;
}

    .kpi-card { border:1px solid #ccc !important; padding:8px 12px; min-width:100px; break-inside:avoid; }
    .card { box-shadow:none !important; border:1px solid #ccc !important; break-inside:avoid; margin-bottom:12px; }
    canvas { max-width:100%; }
    table { width:100%; border-collapse:collapse; }
    th,td { border:1px solid #ccc; padding:4px 6px; font-size:9pt; }
    th { background:#eff6ff !important; -webkit-print-color-adjust:exact; }
    button,.btn { display:none !important; }
    @page { margin:12mm; size:A4; }
  }`;
  document.head.appendChild(style);

  setTimeout(() => {
    window.print();
    setTimeout(() => { printArea.remove(); style.remove(); }, 500);
  }, 300);
}

function renderAggregate(prodId) {
  const prod = state.products.find(p => p.id === prodId);
  if (!prod) return;
  const dept = state.departments.find(d => d.id === prod.deptId);
  setHeader(`月次集計 - ${prod.name}`, dept ? dept.name : '');
  document.getElementById(`nav-agg-${prodId}`)?.classList.add('active');
  document.getElementById('header-actions').innerHTML = `<button class="btn btn-secondary btn-sm" onclick="printAggregate('${prodId}')">🖨️ レポート印刷</button>`;

  // Month options
  const custs = state.customers.filter(c => c._productId === prodId);
  const months = [...new Set(custs.map(c => (c._申込日||'').slice(0,7)).filter(Boolean))].sort().reverse();
  const now = new Date().toISOString().slice(0,7);
  const selMonth = months.includes(now) ? now : (months[0] || now);
  const monthOpts = months.length ? months.map(m => `<option value="${m}" ${m===selMonth?'selected':''}>${m}</option>`).join('') : `<option value="${now}">${now}</option>`;

  document.getElementById('content').innerHTML = `
    <div style="display:flex;gap:12px;align-items:center;margin-bottom:20px;flex-wrap:wrap;">
      <div>
        <label class="form-label" style="margin-bottom:4px;">集計月（申込日ベース）</label>
        <select class="form-control" id="agg-month" onchange="refreshAgg('${prodId}')" style="width:160px;">${monthOpts}</select>
      </div>
    </div>
    <div id="agg-content"></div>`;

  refreshAgg(prodId);
}

function refreshAgg(prodId) {
  const prod = state.products.find(p => p.id === prodId);
  const month = document.getElementById('agg-month')?.value;
  if (!prod || !month) return;

  const agg = prod.aggSettings || {};
  const mapping = prod.columnMapping || {};
  const allCusts = state.customers.filter(c => c._productId === prodId);
  const monthCusts = allCusts.filter(c => (c._申込日||'').startsWith(month));

  const total = monthCusts.length;
  const completedSet = new Set(['完了', '開通済', '工事完了', '納品済', '契約済', 'サービス開始', '完了済', 'done', 'completed']);
  const cancelSet = new Set(['キャンセル', '解約', '中止', 'cancel', 'cancelled', 'NG']);
  const completed = monthCusts.filter(c => completedSet.has(c._ステータス)).length;
  const cancelled = monthCusts.filter(c => cancelSet.has(c._ステータス)).length;
  const compRate = total ? Math.round(completed/total*100) : 0;
  const cancelRate = total ? Math.round(cancelled/total*100) : 0;

  let html = '';

  // KPI
  if (agg.all !== false) {
    let amtHtml = '';
    if (agg.amount && mapping._金額1) {
      const sum1 = monthCusts.reduce((s,c) => s + (parseFloat(c._金額1)||0), 0);
      const lbl1 = prod.amtLabels?.[0] || '数値①';
      amtHtml += `<div class="kpi-card purple"><div class="kpi-label">${escHtml(lbl1)}合計</div><div class="kpi-value">${sum1.toLocaleString()}</div><div class="kpi-sub">${month}</div></div>`;
    }
    if (agg.amount && mapping._金額2) {
      const sum2 = monthCusts.reduce((s,c) => s + (parseFloat(c._金額2)||0), 0);
      const lbl2 = prod.amtLabels?.[1] || '数値②';
      amtHtml += `<div class="kpi-card accent"><div class="kpi-label">${escHtml(lbl2)}合計</div><div class="kpi-value">${sum2.toLocaleString()}</div><div class="kpi-sub">${month}</div></div>`;
    }
    html += `<div class="kpi-grid">
      <div class="kpi-card accent"><div class="kpi-label">総件数</div><div class="kpi-value">${total}</div><div class="kpi-sub">${month} 申込</div></div>
      <div class="kpi-card success"><div class="kpi-label">完了数</div><div class="kpi-value">${completed}</div><div class="kpi-sub">完了率 ${compRate}%</div></div>
      <div class="kpi-card danger"><div class="kpi-label">キャンセル数</div><div class="kpi-value">${cancelled}</div><div class="kpi-sub">キャンセル率 ${cancelRate}%</div></div>
      <div class="kpi-card warning"><div class="kpi-label">処理中</div><div class="kpi-value">${total - completed - cancelled}</div><div class="kpi-sub">未完了</div></div>
      ${amtHtml}
    </div>
    <div class="grid-2" style="margin-bottom:20px;">
      <div class="card card-body">
        <div class="section-title" style="font-size:13px;">完了率</div>
        <div class="progress-wrap">
          <div class="progress-label"><span>完了</span><span>${compRate}%</span></div>
          <div class="progress-bar"><div class="progress-fill success" style="width:${compRate}%"></div></div>
        </div>
      </div>
      <div class="card card-body">
        <div class="section-title" style="font-size:13px;">キャンセル率</div>
        <div class="progress-wrap">
          <div class="progress-label"><span>キャンセル</span><span>${cancelRate}%</span></div>
          <div class="progress-bar"><div class="progress-fill danger" style="width:${cancelRate}%"></div></div>
        </div>
      </div>
    </div>`;
  }

  // Personal ranking
  if (agg.personal !== false && mapping._担当者) {
    const staffMap = {};
    monthCusts.forEach(c => {
      const s = c._担当者 || '不明';
      if (!staffMap[s]) staffMap[s] = { total:0, done:0, cancel:0, amt1:0, amt2:0 };
      staffMap[s].total++;
      if (completedSet.has(c._ステータス)) staffMap[s].done++;
      if (cancelSet.has(c._ステータス)) staffMap[s].cancel++;
      if (mapping._金額1) staffMap[s].amt1 += parseFloat(c._金額1)||0;
      if (mapping._金額2) staffMap[s].amt2 += parseFloat(c._金額2)||0;
    });
    const staffRows = Object.entries(staffMap).sort((a,b) => b[1].total-a[1].total)
      .map(([name, d]) => `<tr>
        <td><b>${escHtml(name)}</b></td>
        <td>${d.total}</td>
        <td>${d.done} (${d.total ? Math.round(d.done/d.total*100) : 0}%)</td>
        <td>${d.cancel}</td>
        ${mapping._金額1 ? `<td>${d.amt1.toLocaleString()}</td>` : ''}
        ${mapping._金額2 ? `<td>${d.amt2.toLocaleString()}</td>` : ''}
      </tr>`).join('') || '<tr><td colspan="5" class="text-muted" style="text-align:center;padding:20px;">データなし</td></tr>';
    const lbl1 = prod.amtLabels?.[0] || '数値①';
    const lbl2 = prod.amtLabels?.[1] || '数値②';
    html += `<div class="card mb-24">
      <div class="card-header"><div class="card-title">👤 担当者別実績</div></div>
      <div class="table-wrap"><table><thead><tr><th>担当者</th><th>件数</th><th>完了</th><th>ｷｬﾝｾﾙ</th>${mapping._金額1 ? `<th>${escHtml(lbl1)}</th>` : ''}${mapping._金額2 ? `<th>${escHtml(lbl2)}</th>` : ''}</tr></thead><tbody>${staffRows}</tbody></table></div>
    </div>`;
  }

  // Status breakdown
  if (agg.status !== false && mapping._ステータス) {
    const statusMap = {};
    monthCusts.forEach(c => {
      const s = c._ステータス || '不明';
      statusMap[s] = (statusMap[s] || 0) + 1;
    });
    const statusRows = Object.entries(statusMap).sort((a,b) => b[1]-a[1])
      .map(([s, n]) => `<tr><td>${escHtml(s)}</td><td>${n}</td><td>${total ? Math.round(n/total*100) : 0}%</td></tr>`).join('');
    html += `<div class="card mb-24">
      <div class="card-header"><div class="card-title">📊 ステータス別内訳</div></div>
      <div style="display:grid;grid-template-columns:1fr 200px;gap:0;">
        <div class="table-wrap"><table><thead><tr><th>ステータス</th><th>件数</th><th>割合</th></tr></thead><tbody>${statusRows}</tbody></table></div>
        <div style="padding:16px;"><div class="chart-container-sm"><canvas id="status-pie"></canvas></div></div>
      </div>
    </div>`;
    // Draw pie after render
    setTimeout(() => {
      const ctx = document.getElementById('status-pie');
      if (ctx) {
        const labels = Object.keys(statusMap);
        const vals = labels.map(l => statusMap[l]);
        const colors = ['#2563eb','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#84cc16','#f97316'];
        new Chart(ctx, { type:'doughnut', data: { labels, datasets:[{ data:vals, backgroundColor:colors.slice(0,labels.length), borderWidth:2 }] }, options: { responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'right', labels:{ font:{ size:10 } } } } } });
      }
    }, 100);
  }

  // Graph
  if (agg.graph !== false && mapping._申込日) {
    // Last 6 months
    const monthsArr = [];
    for (let i = 5; i >= 0; i--) {
      const d = new Date(month + '-01');
      d.setMonth(d.getMonth() - i);
      monthsArr.push(d.toISOString().slice(0,7));
    }
    const monthlyCounts = monthsArr.map(m => allCusts.filter(c => (c._申込日||'').startsWith(m)).length);
    html += `<div class="card mb-24">
      <div class="card-header"><div class="card-title">📈 申込数推移（過去6ヶ月）</div></div>
      <div class="card-body"><div class="chart-container"><canvas id="trend-chart"></canvas></div></div>
    </div>`;
    setTimeout(() => {
      const ctx = document.getElementById('trend-chart');
      if (ctx) new Chart(ctx, { type:'bar', data: { labels: monthsArr, datasets:[{ label:'申込件数', data:monthlyCounts, backgroundColor:'rgba(37,99,235,0.8)', borderRadius:6 }] }, options: { responsive:true, maintainAspectRatio:false, plugins:{ legend:{display:false} }, scales:{ y:{ beginAtZero:true, ticks:{ stepSize:1 } } } } });
    }, 100);
  }

  document.getElementById('agg-content').innerHTML = html;
}

let allPage = 1;
function filterAll() {
  allPage = 1;
  renderAllTable();
}

function renderAllTable() {
  const kw = (document.getElementById('all-search')?.value || '').toLowerCase();
  const prodId = document.getElementById('all-prod')?.value || '';
  let custs = state.customers;
  if (prodId) custs = custs.filter(c => c._productId === prodId);
  if (kw) custs = custs.filter(c =>
    (c._顧客名||'').toLowerCase().includes(kw) ||
    (c._担当者||'').toLowerCase().includes(kw));

  const total = custs.length;
  const pages = Math.ceil(total/PAGE_SIZE)||1;
  const slice = custs.slice((allPage-1)*PAGE_SIZE, allPage*PAGE_SIZE);

  const rows = slice.length ? slice.map(c => {
    const prod = state.products.find(p => p.id === c._productId);
    return `<tr onclick="openCustomerDrawer('${c._id}','${c._productId}')">
      <td><span class="badge badge-blue">${prod ? escHtml(prod.name) : '-'}</span></td>
      <td>${escHtml(c._顧客名||'')}</td>
      <td>${escHtml(c._担当者||'')}</td>
      <td>${escHtml(c._申込日||'')}</td>
      <td>${escHtml(c._ステータス||'')}</td>
    </tr>`;
  }).join('') : '<tr><td colspan="5" style="text-align:center;padding:40px;color:var(--text3);">データがありません</td></tr>';

  document.getElementById('all-table-wrap').innerHTML = `<div class="table-wrap"><table><thead><tr><th>商材</th><th>顧客名</th><th>担当者</th><th>申込日</th><th>ステータス</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  const pag = document.getElementById('all-pagination');
  if (pag) pag.innerHTML = `<span style="font-size:12px;color:var(--text3);">全${total}件 (${allPage}/${pages}ページ)</span>
    <button class="btn btn-secondary btn-sm" ${allPage<=1?'disabled':''} onclick="allPage--;renderAllTable()">前へ</button>
    <button class="btn btn-secondary btn-sm" ${allPage>=pages?'disabled':''} onclick="allPage++;renderAllTable()">次へ</button>`;
}

function exportAllCSV() {
  const custs = state.customers;
  if (!custs.length) { showToast('データがありません','error'); return; }
  const cols = ['商材名','顧客名','担当者','申込日','ステータス','完了日'];
  const lines = [cols.join(','), ...custs.map(c => {
    const prod = state.products.find(p => p.id === c._productId);
    return [prod?.name||'', c._顧客名||'', c._担当者||'', c._申込日||'', c._ステータス||'', c._完了日||'']
      .map(v => `"${String(v).replace(/"/g,'""')}"`).join(',');
  })];
  const blob = new Blob(['\uFEFF' + lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `全商材_${new Date().toISOString().slice(0,10)}.csv`; a.click();
}

function renderFbPageList(prodId) {
  const prod = state.products.find(p => p.id === prodId);
  const fields = prod.formFields || [];

  const rows = fields.map((f, idx) => {
    const selType = FB_TYPES.map(t => `<option value="${t.value}" ${f.type===t.value?'selected':''}>${t.icon} ${t.label}</option>`).join('');
    const hasChoices = CHOICE_TYPES.includes(f.type);

    const choicesHtml = hasChoices ? `
      <div style="margin-top:8px;padding:10px;background:var(--bg);border-radius:6px;">
        <div style="font-size:11px;font-weight:600;color:var(--text3);margin-bottom:6px;">選択肢</div>
        <div id="fbp-choices-${f.id}">
          ${(f.choices||[]).map((c,ci) => `
            <div class="fb-choice-row">
              <span style="font-size:11px;color:var(--text3);width:16px;">${ci+1}</span>
              <input type="text" class="form-control" style="font-size:12px;padding:5px 8px;" value="${escHtml(c)}"
                oninput="fbUpdateChoicePage('${prodId}','${f.id}',${ci},this.value)" placeholder="選択肢${ci+1}">
              <button class="btn btn-ghost btn-sm" style="padding:3px 7px;color:var(--danger);"
                onclick="fbRemoveChoicePage('${prodId}','${f.id}',${ci})">×</button>
            </div>`).join('')}
          <button class="fb-add-choice" onclick="fbAddChoicePage('${prodId}','${f.id}')">＋ 選択肢を追加</button>
        </div>
      </div>` : '';

    return `
      <div style="padding:12px 0;border-bottom:1px solid var(--border);" id="fbprow-${f.id}"
        draggable="true"
        ondragstart="fbDragIdx=${idx}"
        ondragover="event.preventDefault();this.style.borderTop='2px solid var(--accent)'"
        ondragleave="this.style.borderTop=''"
        ondrop="fbDropPage(event,'${prodId}',${idx});this.style.borderTop=''">
        <div style="display:grid;grid-template-columns:36px 1fr 180px 60px 60px 70px;gap:8px;align-items:center;">
          <div style="cursor:grab;color:var(--text3);font-size:18px;text-align:center;user-select:none;">⠿</div>
          <div>
            <input type="text" class="form-control" style="font-size:13px;" value="${escHtml(f.label)}"
              oninput="fbUpdateLabelPage('${prodId}','${f.id}',this.value)" placeholder="項目名を入力">
          </div>
          <select class="form-control" style="font-size:12px;" onchange="fbUpdateTypePage('${prodId}','${f.id}',this.value)">${selType}</select>
          <div style="text-align:center;">
            <input type="checkbox" ${f.required?'checked':''} title="必須にする"
              onchange="fbUpdateRequiredPage('${prodId}','${f.id}',this.checked)"
              style="width:16px;height:16px;accent-color:var(--accent);cursor:pointer;">
          </div>
          <div style="text-align:center;font-size:12px;color:var(--text3);font-weight:600;">${idx+1}</div>
          <button class="btn btn-ghost btn-sm" style="color:var(--danger);font-size:12px;"
            onclick="fbRemoveFieldPage('${prodId}','${f.id}')">削除</button>
        </div>
        ${choicesHtml}
      </div>`;
  }).join('') || `
    <div style="text-align:center;padding:40px;color:var(--text3);">
      <div style="font-size:32px;margin-bottom:8px;">📭</div>
      項目がありません。「＋ 項目を追加」で追加してください。
    </div>`;

  const el = document.getElementById(`fbpage-list-${prodId}`);
  if (el) el.innerHTML = rows;
}

function renderFbPagePreview(prodId) {
  const prod = state.products.find(p => p.id === prodId);
  const fields = prod.formFields || [];
  const el = document.getElementById(`fbpage-preview-${prodId}`);
  if (!el) return;

  if (!fields.length) {
    el.innerHTML = '<div style="text-align:center;color:var(--text3);font-size:12px;padding:20px;">項目を追加するとここにプレビューが表示されます</div>';
    return;
  }

  el.innerHTML = `
    <div style="font-size:11px;font-weight:700;color:var(--text3);margin-bottom:12px;text-transform:uppercase;letter-spacing:0.05em;">${escHtml(prod.name)}</div>
    ${fields.map(f => {
      const req = f.required ? '<span style="color:var(--danger);">*</span>' : '';
      const choices = f.choices && f.choices.length ? f.choices : ['選択肢A','選択肢B'];
      let inp = '';
      switch (f.type) {
        case 'text':    inp = `<input type="text" class="form-control" disabled placeholder="${escHtml(f.label)}" style="font-size:12px;">`; break;
        case 'textarea': inp = `<textarea class="form-control" disabled rows="2" style="font-size:12px;resize:none;" placeholder="${escHtml(f.label)}"></textarea>`; break;
        case 'select':  inp = `<select class="form-control" disabled style="font-size:12px;"><option>選択</option>${choices.map(c=>`<option>${escHtml(c)}</option>`).join('')}</select>`; break;
        case 'radio':   inp = `<div style="display:flex;flex-direction:column;gap:4px;">${choices.map(c=>`<div style="display:flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--border);border-radius:5px;"><input type="radio" disabled><span style="font-size:12px;">${escHtml(c)}</span></div>`).join('')}</div>`; break;
        case 'checkbox': inp = `<div style="display:flex;flex-direction:column;gap:4px;">${choices.map(c=>`<div style="display:flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--border);border-radius:5px;"><input type="checkbox" disabled><span style="font-size:12px;">${escHtml(c)}</span></div>`).join('')}</div>`; break;
        case 'date':    inp = `<input type="date" class="form-control" disabled value="${new Date().toISOString().slice(0,10)}" style="font-size:12px;">`; break;
        case 'number':  inp = `<input type="number" class="form-control" disabled placeholder="0" style="font-size:12px;">`; break;
        case 'tel':     inp = `<input type="tel" class="form-control" disabled placeholder="000-0000-0000" style="font-size:12px;">`; break;
      }
      return `<div style="margin-bottom:10px;"><div style="font-size:11px;font-weight:600;color:var(--text2);margin-bottom:3px;">${escHtml(f.label)} ${req}</div>${inp}</div>`;
    }).join('')}
    <button class="btn btn-primary" style="width:100%;justify-content:center;font-size:13px;margin-top:8px;" disabled>登録する</button>`;
}

// Page版 FB helpers
function fbAddFieldPage(prodId) {
  const prod = state.products.find(p => p.id === prodId);
  prod.formFields = prod.formFields || [];
  prod.formFields.push({ id: genId(), mapKey: '', label: '新しい項目', type: 'text', required: false, choices: [] });
  renderFbPageList(prodId);
  renderFbPagePreview(prodId);
}

function fbRemoveFieldPage(prodId, fieldId) {
  const prod = state.products.find(p => p.id === prodId);
  prod.formFields = prod.formFields.filter(f => f.id !== fieldId);
  renderFbPageList(prodId);
  renderFbPagePreview(prodId);
}

function fbUpdateLabelPage(prodId, fieldId, val) {
  const f = state.products.find(p=>p.id===prodId)?.formFields?.find(f=>f.id===fieldId);
  if (f) { f.label = val; renderFbPagePreview(prodId); }
}

function fbUpdateTypePage(prodId, fieldId, val) {
  const f = state.products.find(p=>p.id===prodId)?.formFields?.find(f=>f.id===fieldId);
  if (f) {
    f.type = val;
    if (CHOICE_TYPES.includes(val) && (!f.choices || f.choices.length === 0)) f.choices = ['選択肢1','選択肢2'];
    renderFbPageList(prodId);
    renderFbPagePreview(prodId);
  }
}

function fbUpdateRequiredPage(prodId, fieldId, val) {
  const f = state.products.find(p=>p.id===prodId)?.formFields?.find(f=>f.id===fieldId);
  if (f) { f.required = val; renderFbPagePreview(prodId); }
}

function fbAddChoicePage(prodId, fieldId) {
  const f = state.products.find(p=>p.id===prodId)?.formFields?.find(f=>f.id===fieldId);
  if (f) { f.choices = f.choices || []; f.choices.push(`選択肢${f.choices.length+1}`); renderFbPageList(prodId); renderFbPagePreview(prodId); }
}

function fbRemoveChoicePage(prodId, fieldId, idx) {
  const f = state.products.find(p=>p.id===prodId)?.formFields?.find(f=>f.id===fieldId);
  if (f) { f.choices.splice(idx,1); renderFbPageList(prodId); renderFbPagePreview(prodId); }
}

function fbUpdateChoicePage(prodId, fieldId, idx, val) {
  const f = state.products.find(p=>p.id===prodId)?.formFields?.find(f=>f.id===fieldId);
  if (f && f.choices) { f.choices[idx] = val; renderFbPagePreview(prodId); }
}

function fbDropPage(e, prodId, targetIdx) {
  e.preventDefault();
  if (fbDragIdx === null || fbDragIdx === targetIdx) return;
  const prod = state.products.find(p => p.id === prodId);
  const moved = prod.formFields.splice(fbDragIdx, 1)[0];
  prod.formFields.splice(targetIdx, 0, moved);
  fbDragIdx = null;
  renderFbPageList(prodId);
  renderFbPagePreview(prodId);
}

function resetFormFields(prodId) {
  if (!confirm('このフォームの設計をリセットしますか？')) return;

  prod.formFields = [];

let fbDragIdx = null;

function openFormBuilder(prodId) {
  const prod = state.products.find(p => p.id === prodId);

        </div>
        <div style="font-size:11px;color:var(--text3);margin-bottom:8px;">

  ], 'modal-lg');

function buildDefaultFormFields(prod) {
  // Build from existing column mapping
  const mapping = prod.columnMapping || {};
  const fields = [];
  const mapDefs = [
    { key: '_顧客名',   label: '顧客名',   type: 'text',   required: true },
    { key: '_申込日',   label: '申込日',   type: 'date',   required: true },
    { key: '_担当者',   label: '担当者',   type: 'select', required: true,  choices: prod.staffValues || [] },
    { key: '_ステータス', label: 'ステータス', type: 'radio', required: true, choices: prod.statusValues || [] },
    { key: '_完了日',   label: '完了日',   type: 'date',   required: false },
    { key: '_サブ担当者', label: 'サブ担当者', type: 'select', required: false, choices: prod.staffValues || [] },
    { key: '_金額1',    label: prod.amtLabels?.[0] || '数値①', type: 'number', required: false },
    { key: '_金額2',    label: prod.amtLabels?.[1] || '数値②', type: 'number', required: false },
  ];
  mapDefs.forEach(d => {
    if (mapping[d.key]) {
      fields.push({ id: genId(), mapKey: d.key, label: d.label, type: d.type, required: d.required, choices: d.choices || [] });
    }
  });
  if (fields.length === 0) {
    // No mapping yet - create basic fields
    fields.push(
      { id: genId(), mapKey: '_顧客名',     label: '顧客名',   type: 'text',   required: true,  choices: [] },
      { id: genId(), mapKey: '_申込日',     label: '申込日',   type: 'date',   required: true,  choices: [] },
      { id: genId(), mapKey: '_担当者',     label: '担当者',   type: 'text',   required: true,  choices: [] },
      { id: genId(), mapKey: '_ステータス', label: 'ステータス', type: 'select', required: true, choices: [] },
    );
  }
  return fields;
}

function renderFbList(prodId) {
  const prod = state.products.find(p => p.id === prodId);
  const fields = prod.formFields || [];
  const typeOpts = FB_TYPES.map(t => `<option value="${t.value}">${t.icon} ${t.label}</option>`).join('');

  const rows = fields.map((f, idx) => {
    const selType = FB_TYPES.map(t => `<option value="${t.value}" ${f.type===t.value?'selected':''}>${t.icon} ${t.label}</option>`).join('');
    const hasChoices = CHOICE_TYPES.includes(f.type);
    const choicesHtml = hasChoices ? `
      <div class="fb-choices" id="fb-choices-${f.id}">
        ${(f.choices||[]).map((c,ci) => `
          <div class="fb-choice-row">
            <input type="text" class="form-control" style="font-size:12px;padding:4px 8px;" value="${escHtml(c)}" oninput="fbUpdateChoice('${prodId}','${f.id}',${ci},this.value)" placeholder="選択肢${ci+1}">
            <button class="btn btn-ghost btn-sm" style="padding:2px 6px;color:var(--danger);" onclick="fbRemoveChoice('${prodId}','${f.id}',${ci})">×</button>

        <button class="fb-add-choice" onclick="fbAddChoice('${prodId}','${f.id}')">＋ 選択肢を追加</button>

    return `<div class="fb-row" draggable="true" id="fbrow-${f.id}"
        ondragstart="fbDragStart(${idx})"

      <div style="text-align:center;">

      </div>
      <div style="text-align:center;font-size:10px;color:var(--text3);">No.${idx+1}</div>
      <button class="btn btn-ghost btn-sm" style="color:var(--danger);" onclick="fbRemoveField('${prodId}','${f.id}')">削除</button>
    </div>`;
  }).join('') || '<div style="text-align:center;padding:20px;color:var(--text3);">項目がありません</div>';

  const listEl = document.getElementById(`fb-list-${prodId}`);
  if (listEl) listEl.innerHTML = rows;
}

function renderFbPreview(prodId) {
  const prod = state.products.find(p => p.id === prodId);
  const fields = prod.formFields || [];
  const previewEl = document.getElementById(`fb-preview-${prodId}`);
  if (!previewEl) return;

  if (fields.length === 0) {
    previewEl.innerHTML = '<div style="text-align:center;color:var(--text3);font-size:12px;">項目を追加してください</div>';
    return;
  }

  previewEl.innerHTML = fields.map(f => {
    const req = f.required ? '<span style="color:var(--danger);margin-left:2px;">*</span>' : '';
    let input = '';
    const choices = f.choices && f.choices.length ? f.choices : ['選択肢1','選択肢2'];
    switch (f.type) {
      case 'text':
        input = `<input type="text" class="form-control" disabled placeholder="${escHtml(f.label)}を入力" style="font-size:12px;">`;
        break;
      case 'textarea':
        input = `<textarea class="form-control" disabled rows="2" placeholder="${escHtml(f.label)}を入力" style="font-size:12px;resize:none;"></textarea>`;
        break;
      case 'select':
        input = `<select class="form-control" disabled style="font-size:12px;"><option>選択してください</option>${choices.map(c=>`<option>${escHtml(c)}</option>`).join('')}</select>`;
        break;
      case 'radio':
        input = `<div class="radio-group">${choices.map(c=>`<div class="radio-item"><input type="radio" disabled><label style="font-size:12px;">${escHtml(c)}</label></div>`).join('')}</div>`;
        break;
      case 'checkbox':
        input = `<div class="checkbox-group">${choices.map(c=>`<div class="checkbox-item"><input type="checkbox" disabled><label style="font-size:12px;">${escHtml(c)}</label></div>`).join('')}</div>`;
        break;
      case 'date':
        input = `<input type="date" class="form-control" disabled value="${new Date().toISOString().slice(0,10)}" style="font-size:12px;">`;
        break;
      case 'number':
        input = `<input type="number" class="form-control" disabled placeholder="0" style="font-size:12px;">`;
        break;
      case 'tel':
        input = `<input type="tel" class="form-control" disabled placeholder="000-0000-0000" style="font-size:12px;">`;
        break;
    }
    return `<div style="margin-bottom:12px;"><div style="font-size:11px;font-weight:600;color:var(--text2);margin-bottom:4px;">${escHtml(f.label)}${req}</div>${input}</div>`;
  }).join('') + `<button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px;font-size:13px;" disabled>登録する</button>`;
}

function fbUpdateType(prodId, fieldId, val) {

function fbUpdateRequired(prodId, fieldId, val) {

  if (f) { f.required = val; renderFbPreview(prodId); }
}

function fbAddChoice(prodId, fieldId) {
  const prod = state.products.find(p => p.id === prodId);
  const f = (prod.formFields || []).find(f => f.id === fieldId);
  if (f) {
    f.choices = f.choices || [];

    renderFbPreview(prodId);

}

function fbRemoveChoice(prodId, fieldId, idx) {
  const prod = state.products.find(p => p.id === prodId);
  const f = (prod.formFields || []).find(f => f.id === fieldId);
  if (f) {
    f.choices.splice(idx, 1);
    renderFbList(prodId);
    renderFbPreview(prodId);
  }
}

function fbUpdateChoice(prodId, fieldId, idx, val) {
  const prod = state.products.find(p => p.id === prodId);
  const f = (prod.formFields || []).find(f => f.id === fieldId);
  if (f && f.choices) {
    f.choices[idx] = val;
    renderFbPreview(prodId);
  }
}

function fbDragStart(idx) { fbDragIdx = idx; }
function fbDrop(e, prodId, targetIdx) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if (fbDragIdx === null || fbDragIdx === targetIdx) return;
  const prod = state.products.find(p => p.id === prodId);
  const fields = prod.formFields;
  const moved = fields.splice(fbDragIdx, 1)[0];
  fields.splice(targetIdx, 0, moved);
  fbDragIdx = null;
  renderFbList(prodId);
  renderFbPreview(prodId);
}

function renderFormFields() {
  const prodId = document.getElementById('form-prod-select').value;
  const fieldsDiv = document.getElementById('form-fields');
  const submitDiv = document.getElementById('form-submit-area');
  if (!prodId) { fieldsDiv.innerHTML = ''; submitDiv.style.display = 'none'; return; }

  const prod = state.products.find(p => p.id === prodId);
  if (!prod) return;

  // Use formFields if available, otherwise build defaults
  const fields = prod.formFields && prod.formFields.length > 0
    ? prod.formFields
    : buildDefaultFormFields(prod);

  const makeFormField = (f) => {
    const id = `ff-${f.id}`;
    const req = f.required ? '<span class="required"> *</span>' : '';
    const label = `<label class="form-label" for="${id}">${escHtml(f.label)}${req}</label>`;
    const choices = f.choices && f.choices.length ? f.choices : [];

    switch (f.type) {
      case 'text':
        return `<div class="form-group">${label}<input type="text" class="form-control" id="${id}" placeholder="${escHtml(f.label)}を入力"></div>`;
      case 'textarea':
        return `<div class="form-group">${label}<textarea class="form-control" id="${id}" rows="3" placeholder="${escHtml(f.label)}を入力" style="resize:vertical;"></textarea></div>`;
      case 'select':
        const sOpts = ['<option value="">選択してください</option>', ...choices.map(c => `<option value="${escHtml(c)}">${escHtml(c)}</option>`)].join('');
        return `<div class="form-group">${label}<select class="form-control" id="${id}">${sOpts}</select></div>`;
      case 'radio':
        const radioItems = choices.map((c,i) => `
          <div class="radio-item" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;cursor:pointer;transition:all 0.15s;" onclick="this.querySelector('input').click()">
            <input type="radio" name="${id}" id="${id}_${i}" value="${escHtml(c)}" style="accent-color:var(--accent);">
            <label for="${id}_${i}" style="cursor:pointer;font-size:13px;">${escHtml(c)}</label>
          </div>`).join('');
        return `<div class="form-group">${label}<div class="radio-group" id="${id}">${radioItems || '<div style="color:var(--text3);font-size:12px;">選択肢が設定されていません</div>'}</div></div>`;
      case 'checkbox':
        const cbItems = choices.map((c,i) => `
          <div class="checkbox-item" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;cursor:pointer;transition:all 0.15s;" onclick="this.querySelector('input').click()">
            <input type="checkbox" id="${id}_${i}" value="${escHtml(c)}" style="accent-color:var(--accent);">
            <label for="${id}_${i}" style="cursor:pointer;font-size:13px;">${escHtml(c)}</label>
          </div>`).join('');
        return `<div class="form-group">${label}<div class="checkbox-group" id="${id}">${cbItems || '<div style="color:var(--text3);font-size:12px;">選択肢が設定されていません</div>'}</div></div>`;
      case 'date':
        return `<div class="form-group">${label}<input type="date" class="form-control" id="${id}" value="${new Date().toISOString().slice(0,10)}"></div>`;
      case 'number':
        return `<div class="form-group">${label}<input type="number" class="form-control" id="${id}" placeholder="0"></div>`;
      case 'tel':
        return `<div class="form-group">${label}<input type="tel" class="form-control" id="${id}" placeholder="000-0000-0000"></div>`;
      default:
        return `<div class="form-group">${label}<input type="text" class="form-control" id="${id}" placeholder="${escHtml(f.label)}を入力"></div>`;
    }
  };

  fieldsDiv.innerHTML = `<div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border);">${fields.map(f => makeFormField(f)).join('')}</div>`;
  submitDiv.style.display = '';
}

function getFieldValue(f) {
  const id = `ff-${f.id}`;
  switch (f.type) {
    case 'radio': {
      const checked = document.querySelector(`input[name="${id}"]:checked`);
      return checked ? checked.value : '';
    }
    case 'checkbox': {
      const checked = [...document.querySelectorAll(`#${id} input[type="checkbox"]:checked`)];
      return checked.map(el => el.value).join(', ');
    }
    case 'textarea': {
      const el = document.getElementById(id);
      return el ? el.value.trim() : '';
    }
    default: {
      const el = document.getElementById(id);
      return el ? el.value.trim() : '';
    }
  }
}

function submitForm() {
  const prodId = document.getElementById('form-prod-select').value;
  const prod = state.products.find(p => p.id === prodId);
  if (!prod) return;

  const fields = prod.formFields && prod.formFields.length > 0
    ? prod.formFields
    : buildDefaultFormFields(prod);

  const newCust = { _id: genId(), _productId: prodId, _importedAt: new Date().toISOString() };
  const mapping = prod.columnMapping || {};

  let valid = true;
  for (const f of fields) {
    const val = getFieldValue(f);
    if (f.required && !val) {
      showToast(`「${f.label}」を入力してください`, 'error');
      valid = false; break;
    }
    newCust[f.label] = val;
    // Also map to standard keys
    if (f.mapKey) {
      newCust[f.mapKey] = val;
      if (mapping[f.mapKey]) newCust[mapping[f.mapKey]] = val;
    }
  }
  if (!valid) return;

  state.customers.push(newCust);

  // Update status/staff value caches
  if (newCust._ステータス && !prod.statusValues.includes(newCust._ステータス)) prod.statusValues.push(newCust._ステータス);
  if (newCust._担当者 && !prod.staffValues.includes(newCust._担当者)) prod.staffValues.push(newCust._担当者);

  saveState();
  showToast('✅ 登録しました！', 'success');

  // Reset
  document.getElementById('form-prod-select').value = '';
  document.getElementById('form-fields').innerHTML = '';
  document.getElementById('form-submit-area').style.display = 'none';

  if (state.notifications.email.enabled) {
    showToast('通知メールを送信しました（Firebase連携後に有効化）', 'info');
  }
}

let _chatChannelId = null;
let _emojiPickerTarget = null;

function initChatState() {
  if (!state.chat) {
    const generalId = genId();

    state.chat = {
      channels: [
        { id: generalId,   type: 'channel', name: '全体連絡',  icon: '📢', desc: '全員への連絡・お知らせ', messages: [] },
        { id: announceId,  type: 'channel', name: '雑談',      icon: '☕', desc: '気軽に話しましょう',  messages: [] },
      ],
      dms: [],  // { id, users: [uid1,uid2], messages: [] }
      readStatus: {},  // { [channelId]: lastReadTimestamp }
    };
    // デモメッセージを追加
    const now = new Date();
    const fmt = (d) => d.toISOString();
    state.chat.channels[0].messages.push({
      id: genId(), userId: 'u1', userName: '管理者', userAvatar: 'A',
      text: 'Prism Desk へようこそ！社内チャットが使えるようになりました。',
      createdAt: fmt(new Date(now - 3600000)), reactions: {}, linkedCustId: null
    });
    saveState();
  }
  if (!state.chat.readStatus) state.chat.readStatus = {};
}

function getChatUnreadCount() {
  if (!state.chat) return 0;
  let total = 0;
  const allChannels = [...(state.chat.channels||[]), ...(state.chat.dms||[])];
  allChannels.forEach(ch => {
    const lastRead = state.chat.readStatus?.[ch.id] || '';
    const unread = (ch.messages||[]).filter(m => m.createdAt > lastRead && m.userId !== state.currentUser?.id).length;
    total += unread;
  });
  return total;
}

function updateChatBadge() {
  const count = getChatUnreadCount();
  const badge = document.getElementById('chat-unread-badge');
  if (badge) {
    badge.textContent = count > 99 ? '99+' : count;
    badge.style.display = count > 0 ? 'inline-flex' : 'none';
  }
}

function renderChat(params = {}) {
  setHeader('社内チャット', 'コミュニケーション');
  document.getElementById('nav-chat')?.classList.add('active');
  initChatState();

  const channels = state.chat.channels || [];
  const dms = state.chat.dms || [];
  const me = state.currentUser;

  // デフォルトチャンネル
  if (!_chatChannelId || !findChannel(_chatChannelId)) {
    _chatChannelId = channels[0]?.id;
  }
  if (params.channelId) _chatChannelId = params.channelId;

  document.getElementById('header-actions').innerHTML = `
    <button class="btn btn-secondary btn-sm" onclick="openNewChannelModal()">＋ チャンネル追加</button>
    <button class="btn btn-secondary btn-sm" onclick="openNewDMModal()">✉️ DM送信</button>`;

  // チャンネルリスト
  const channelItems = channels.map(ch => {
    const unread = getUnreadCount(ch.id);
    return `<button class="chat-channel-item ${ch.id===_chatChannelId?'active':''}"
      onclick="switchChannel('${ch.id}')">
      <span class="chat-channel-icon">${ch.icon||'#'}</span>
      <span class="chat-channel-name">${escHtml(ch.name)}</span>
      ${unread > 0 ? `<span class="chat-unread-dot">${unread}</span>` : ''}
    </button>`;
  }).join('');

  const dmItems = dms.map(dm => {
    const other = state.users.find(u => dm.users.includes(u.id) && u.id !== me?.id);
    const unread = getUnreadCount(dm.id);
    return `<button class="chat-channel-item ${dm.id===_chatChannelId?'active':''}"
      onclick="switchChannel('${dm.id}')">
      <span class="chat-channel-icon">👤</span>
      <span class="chat-channel-name">${escHtml(other?.name||'不明')}</span>
      ${unread > 0 ? `<span class="chat-unread-dot">${unread}</span>` : ''}
    </button>`;
  }).join('');

  document.getElementById('content').innerHTML = `
    <div class="chat-layout">
      <div class="chat-sidebar">
        <div class="chat-sidebar-header">💬 チャット</div>
        <div class="chat-channel-list">
          <div class="chat-section-label">チャンネル</div>
          ${channelItems || '<div style="padding:8px 14px;font-size:12px;color:var(--text3);">なし</div>'}
          <div class="chat-section-label" style="margin-top:8px;">ダイレクトメッセージ</div>
          ${dmItems || '<div style="padding:8px 14px;font-size:12px;color:var(--text3);">なし</div>'}
        </div>
      </div>
      <div class="chat-main" id="chat-main"></div>
    </div>`;

  renderChatMain(_chatChannelId);
}

function findChannel(id) {
  return [...(state.chat.channels||[]), ...(state.chat.dms||[])].find(c => c.id === id);
}

function getUnreadCount(channelId) {
  const ch = findChannel(channelId);
  if (!ch) return 0;
  const lastRead = state.chat.readStatus?.[channelId] || '';
  return (ch.messages||[]).filter(m => m.createdAt > lastRead && m.userId !== state.currentUser?.id).length;
}

function switchChannel(channelId) {
  _chatChannelId = channelId;
  // 既読にする
  state.chat.readStatus = state.chat.readStatus || {};
  const ch = findChannel(channelId);
  if (ch?.messages?.length) {
    state.chat.readStatus[channelId] = ch.messages[ch.messages.length-1].createdAt;
  }
  saveState();
  renderChat({ channelId });
}

function renderMessages(channelId) {
  const ch = findChannel(channelId);
  const msgEl = document.getElementById('chat-messages');
  if (!msgEl || !ch) return;

  const messages = ch.messages || [];
  const me = state.currentUser;
  let lastDate = '';
  let html = '';

  if (messages.length === 0) {
    html = `<div style="text-align:center;padding:40px 20px;color:var(--text3);">
      <div style="font-size:40px;margin-bottom:8px;">💬</div>
      <div style="font-size:14px;font-weight:600;">まだメッセージはありません</div>
      <div style="font-size:12px;margin-top:4px;">最初のメッセージを送ってみましょう</div>
    </div>`;
  } else {
    messages.forEach((msg, idx) => {
      const msgDate = msg.createdAt?.slice(0,10) || '';
      if (msgDate !== lastDate) {
        const d = new Date(msg.createdAt);
        const today = new Date().toISOString().slice(0,10);
        const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
        const label = msgDate === today ? '今日' : msgDate === yesterday ? '昨日' : d.toLocaleDateString('ja-JP',{month:'long',day:'numeric'});
        html += `<div class="chat-date-divider"><span>${label}</span></div>`;
        lastDate = msgDate;
      }

      const isMine = msg.userId === me?.id;
      const time = new Date(msg.createdAt).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});

      // リアクション集計
      const reactionMap = {};
      Object.entries(msg.reactions||{}).forEach(([userId, emojis]) => {
        (emojis||[]).forEach(e => {
          if (!reactionMap[e]) reactionMap[e] = { count:0, users:[], mine: false };
          reactionMap[e].count++;
          reactionMap[e].users.push(userId);
          if (userId === me?.id) reactionMap[e].mine = true;
        });
      });
      const reactionsHtml = Object.entries(reactionMap).map(([e, data]) =>
        `<button class="chat-reaction ${data.mine?'mine':''}"
          onclick="toggleReaction('${channelId}','${msg.id}','${e}')"
          title="${data.users.map(uid => state.users.find(u=>u.id===uid)?.name||uid).join(', ')}">
          ${e} <span class="chat-reaction-count">${data.count}</span>
        </button>`).join('');

      // 顧客リンク
      const linkedHtml = msg.linkedCustId ? (() => {
        const cust = state.customers.find(c => c._id === msg.linkedCustId);
        const prod = cust ? state.products.find(p => p.id === cust._productId) : null;
        return cust ? `<div class="chat-linked-card" onclick="openCustomerDrawer('${cust._id}','${cust._productId}')">
          🔗 ${escHtml(cust._顧客名||'')} <span style="opacity:0.7;">${prod?escHtml(prod.name):''}</span>
        </div>` : '';
      })() : '';

      html += `
        <div class="chat-msg ${isMine?'mine':''}" id="cmsg-${msg.id}">
          <div class="chat-avatar" style="background:${stringToColor(msg.userId)};">${escHtml(msg.userAvatar||msg.userName?.[0]||'?')}</div>
          <div class="chat-msg-body">
            <div class="chat-msg-header">
              <span class="chat-msg-name">${isMine ? 'あなた' : escHtml(msg.userName)}</span>
              <span class="chat-msg-time">${time}</span>
            </div>
            <div class="chat-msg-text">${escHtml(msg.text).replace(/\n/g,'<br>')}</div>
            ${linkedHtml}
            ${reactionsHtml ? `<div class="chat-reaction-bar">${reactionsHtml}</div>` : ''}
          </div>
          <div class="chat-msg-actions">
            <button class="chat-input-btn" style="font-size:14px;" onclick="showReactionPicker(event,'${channelId}','${msg.id}')" title="リアクション">😊</button>
            ${isMine ? `<button class="chat-input-btn" style="font-size:13px;color:var(--danger);" onclick="deleteMessage('${channelId}','${msg.id}')">🗑</button>` : ''}
          </div>
        </div>`;
    });
  }

  msgEl.innerHTML = html;
  msgEl.scrollTop = msgEl.scrollHeight;
}

function sendChatMessage(channelId, linkedCustId = null, linkedCustName = null) {
  const ta = document.getElementById('chat-textarea');
  const text = ta?.value.trim();
  if (!text) return;

  const ch = findChannel(channelId);
  if (!ch) return;
  const me = state.currentUser;

  const msg = {
    id: genId(),
    userId: me?.id || 'unknown',
    userName: me?.name || '名無し',
    userAvatar: me?.avatar || me?.name?.[0] || '?',
    text,
    createdAt: new Date().toISOString(),
    reactions: {},
    linkedCustId: window._pendingLinkCustId || null,
    linkedCustName: window._pendingLinkCustName || null,
  };
  window._pendingLinkCustId = null;
  window._pendingLinkCustName = null;

  ch.messages.push(msg);
  // 既読を更新
  state.chat.readStatus = state.chat.readStatus || {};
  state.chat.readStatus[channelId] = msg.createdAt;
  saveState();

  ta.value = '';
  ta.style.height = 'auto';
  const btn = document.getElementById('chat-send-btn');
  if (btn) btn.disabled = true;

  renderMessages(channelId);
  updateChatBadge();
}

function handleChatKey(e, channelId) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendChatMessage(channelId);
  }
}

function autoResizeTextarea(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 150) + 'px';
}

function toggleReaction(channelId, msgId, emoji) {
  const ch = findChannel(channelId);
  const msg = ch?.messages.find(m => m.id === msgId);
  if (!msg) return;
  const me = state.currentUser?.id || 'u1';
  msg.reactions = msg.reactions || {};
  msg.reactions[me] = msg.reactions[me] || [];
  const idx = msg.reactions[me].indexOf(emoji);
  if (idx >= 0) msg.reactions[me].splice(idx, 1);
  else msg.reactions[me].push(emoji);
  saveState();
  renderMessages(channelId);
}

function deleteMessage(channelId, msgId) {
  if (!confirm('このメッセージを削除しますか？')) return;
  const ch = findChannel(channelId);
  if (ch) {
    ch.messages = ch.messages.filter(m => m.id !== msgId);
    saveState();
    renderMessages(channelId);
  }
}

function showReactionPicker(e, channelId, msgId) {
  e.stopPropagation();
  document.querySelectorAll('.emoji-picker').forEach(el => el.remove());
  const picker = document.createElement('div');
  picker.className = 'emoji-picker';
  picker.innerHTML = CHAT_EMOJIS.map(em =>
    `<button class="emoji-btn" onclick="toggleReaction('${channelId}','${msgId}','${em}');this.closest('.emoji-picker').remove()">${em}</button>`
  ).join('');
  const rect = e.currentTarget.getBoundingClientRect();
  picker.style.cssText = `position:fixed;top:${rect.bottom+4}px;left:${rect.left}px;`;
  document.body.appendChild(picker);
  setTimeout(() => document.addEventListener('click', () => picker.remove(), { once: true }), 50);
}

function toggleEmojiPicker(e) {
  e.stopPropagation();
  const ta = document.getElementById('chat-textarea');
  if (!ta) return;
  document.querySelectorAll('.emoji-picker').forEach(el => el.remove());
  const picker = document.createElement('div');
  picker.className = 'emoji-picker';
  picker.innerHTML = CHAT_EMOJIS.map(em =>
    `<button class="emoji-btn" onclick="document.getElementById('chat-textarea').value+='${em}';document.getElementById('chat-textarea').dispatchEvent(new Event('input'));this.closest('.emoji-picker').remove()">${em}</button>`
  ).join('');
  const btn = e.currentTarget;
  const rect = btn.getBoundingClientRect();
  picker.style.cssText = `position:fixed;bottom:${window.innerHeight-rect.top+4}px;left:${rect.left}px;`;
  document.body.appendChild(picker);
  setTimeout(() => document.addEventListener('click', () => picker.remove(), { once: true }), 50);
}

function stringToColor(str) {
  const colors = ['#2563eb','#10b981','#f59e0b','#8b5cf6','#0d9488','#db2777','#0891b2','#16a34a'];
  let hash = 0;
  for (let i = 0; i < (str||'').length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
  return colors[Math.abs(hash) % colors.length];
}

  }
  // 起動時に完了カードの自動クリーンアップを実行
  autoCleanDoneCards();

// 完了カードの自動クリーンアップ（翌日以降に削除）
function autoCleanDoneCards() {
  if (!state.kanban?.boards) return;
  const today = new Date().toISOString().slice(0,10);
  let cleaned = 0;
  state.kanban.boards.forEach(board => {
    board.cols.forEach(col => {
      if (!col.autoClean && !col.isDoneCol) return;
      const before = col.cards.length;
      col.cards = col.cards.filter(card => {
        if (!card.done || !card.doneAt) return true;
        // 完了日が今日より前なら削除
        const doneDate = card.doneAt.slice(0,10);
        return doneDate >= today;
      });
      cleaned += before - col.cards.length;
    });
  });
  if (cleaned > 0) {
    saveState();
    console.log(`自動クリーン: ${cleaned}件の完了カードを削除しました`);
  }
}

    return `
      <div class="kanban-card ${priorityClass} ${card.done?'opacity-50':''}"
        id="kcard-${card.id}"
        draggable="true"
        ondragstart="startDragCard(event,'${card.id}','${col.id}','${boardId}')"

              ${isOverdue?'⚠️ ':isDueToday?'📅 ':''}${card.dueDate}

  const isDoneCol = col.isDoneCol || col.title === '完了';

  return `
    <div class="kanban-col" id="kcol-${col.id}" style="${isDoneCol ? 'opacity:0.85;' : ''}">

// ===== ドラッグ＆ドロップ =====
function startDragCard(e, cardId, colId, boardId) {
  _dragCard = { cardId, colId, boardId };
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
function endDragCard(e) {
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.kanban-cards').forEach(el => el.classList.remove('drag-over'));
}
function dropCard(e, targetColId, boardId) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if (!_dragCard || _dragCard.colId === targetColId) { _dragCard = null; return; }

  const board = state.kanban.boards.find(b => b.id === boardId);
  if (!board) return;
  const fromCol = board.cols.find(c => c.id === _dragCard.colId);
  const toCol   = board.cols.find(c => c.id === targetColId);
  if (!fromCol || !toCol) return;

  const cardIdx = fromCol.cards.findIndex(c => c.id === _dragCard.cardId);
  if (cardIdx === -1) return;
  const [card] = fromCol.cards.splice(cardIdx, 1);

  // 移動履歴を記録
  card._history = card._history || [];
  card._history.unshift({
    from: fromCol.title, to: toCol.title,
    movedBy: state.currentUser?.name || '管理者',
    movedAt: new Date().toISOString()
  });

  toCol.cards.push(card);
  _dragCard = null;
  saveState();
  renderKanban();
}

// ===== カード操作 =====
function quickDone(cardId, colId, boardId) {
  const board   = state.kanban.boards.find(b => b.id === boardId);
  const fromCol = board?.cols.find(c => c.id === colId);
  const card    = fromCol?.cards.find(c => c.id === cardId);
  if (!card) return;

  const wasAlreadyDone = card.done;

  if (!wasAlreadyDone) {
    // 完了にする → 完了列（isDoneCol or title==='完了'）に移動
    const doneCol = board.cols.find(c => c.isDoneCol || c.title === '完了');
    card.done   = true;
    card.doneAt = new Date().toISOString();
    card._history = card._history || [];
    card._history.unshift({
      from: fromCol.title,
      to: doneCol ? doneCol.title : fromCol.title,
      movedBy: state.currentUser?.name || '管理者',
      movedAt: new Date().toISOString()
    });
    if (doneCol && doneCol.id !== colId) {
      // 完了列に移動
      fromCol.cards = fromCol.cards.filter(c => c.id !== cardId);
      doneCol.cards.unshift(card); // 先頭に追加（最新完了が上に来る）
    }
    showToast('✅ 完了！翌日に自動削除されます', 'success');
  } else {
    // 完了を取り消す
    card.done   = false;
    card.doneAt = null;
    showToast('完了を取り消しました', 'info');
  }

  saveState();
  renderKanban();
}

function moveCardToCol(cardId, fromColId, boardId, toColId) {
  if (fromColId === toColId) return;
  const board   = state.kanban.boards.find(b => b.id === boardId);
  const fromCol = board?.cols.find(c => c.id === fromColId);
  const toCol   = board?.cols.find(c => c.id === toColId);
  if (!fromCol || !toCol) return;
  const idx = fromCol.cards.findIndex(c => c.id === cardId);
  if (idx === -1) return;
  const [card] = fromCol.cards.splice(idx, 1);
  card._history = card._history || [];
  card._history.unshift({ from: fromCol.title, to: toCol.title, movedBy: state.currentUser?.name||'管理者', movedAt: new Date().toISOString() });
  toCol.cards.push(card);
  saveState();
}

function toggleCheckItem(cardId, colId, boardId, idx, checked) {
  const card = state.kanban.boards.find(b=>b.id===boardId)?.cols.find(c=>c.id===colId)?.cards.find(c=>c.id===cardId);
  if (card?.checklist?.[idx]) { card.checklist[idx].checked = checked; saveState(); }
}
function removeCheckItem(cardId, colId, boardId, idx) {
  const card = state.kanban.boards.find(b=>b.id===boardId)?.cols.find(c=>c.id===colId)?.cards.find(c=>c.id===cardId);
  if (card?.checklist) { card.checklist.splice(idx, 1); saveState(); openCardDetail(cardId, colId, boardId); }
}
function addCheckItem(cardId, colId, boardId) {
  const text = document.getElementById('new-check-item')?.value.trim();
  if (!text) return;
  const card = state.kanban.boards.find(b=>b.id===boardId)?.cols.find(c=>c.id===colId)?.cards.find(c=>c.id===cardId);
  if (card) {
    card.checklist = card.checklist || [];
    card.checklist.push({ id: genId(), text, checked: false });
    saveState();
    document.getElementById('new-check-item').value = '';
    openCardDetail(cardId, colId, boardId);
  }
}

// 手動で完了カードを即時削除
function manualCleanDoneCards(boardId) {
  if (!confirm('完了済みのカードを今すぐ全て削除しますか？')) return;
  const board = state.kanban.boards.find(b => b.id === boardId);
  if (!board) return;
  let count = 0;
  board.cols.forEach(col => {
    const before = col.cards.length;
    col.cards = col.cards.filter(c => !c.done);
    count += before - col.cards.length;
  });
  saveState();
  renderKanban();
  showToast(`${count}件の完了カードを削除しました`, 'success');
}

  `, [
    { label:'キャンセル', cls:'btn-secondary', action: closeModal },
    { label:'取込む', cls:'btn-primary', action: () => {
      const prodId  = document.getElementById('import-kanban-prod').value;
      const colId   = document.getElementById('import-kanban-col').value;
      const status  = document.getElementById('import-kanban-status').value;
      const board   = state.kanban.boards.find(b => b.id === boardId);
      const col     = board?.cols.find(c => c.id === colId);
      if (!col) return;

      const existingLinks = new Set(board.cols.flatMap(c => c.cards.map(card => card.linkedCustId)).filter(Boolean));
      let custs = state.customers.filter(c => c._productId === prodId && !existingLinks.has(c._id));
      if (status) custs = custs.filter(c => c._ステータス === status);

      custs.forEach(cust => {

          id: genId(),
          title: cust._顧客名 || '顧客',

          dueDate: cust._完了日 || null,

          linkedCustId: cust._id,
          linkedCustName: cust._顧客名,
          createdAt: new Date().toISOString(),
          createdBy: state.currentUser?.name || 'インポート',
          _history: [],
        });
      });
      saveState(); closeModal(); renderKanban();
      showToast(`${custs.length}件のカードを取込みました`,'success');
    }}
  ], 'modal-md');
}

const PLANS = {
  free:      { name: 'Free',       price: 0,    maxProducts: 1,  maxRecords: 500,   maxUsers: 3,  maxBoards: 1,  features: ['基本フォーム','基本集計','CSV出力','カンバン1ボード'] },
  starter:   { name: 'Starter',    price: 980,  maxProducts: 5,  maxRecords: 5000,  maxUsers: 10, maxBoards: 5,  features: ['全フォームタイプ','Google連携','業種テンプレート','カンバン5ボード'] },
  business:  { name: 'Business',   price: 2980, maxProducts: -1, maxRecords: -1,    maxUsers: -1, maxBoards: -1, features: ['AI分析','請求書生成','高度レポート','カンバン無制限'] },
  enterprise:{ name: 'Enterprise', price: -1,   maxProducts: -1, maxRecords: -1,    maxUsers: -1, maxBoards: -1, features: ['全機能','カスタマイズ','保守サポート','専任担当'] },
};

function getCurrentPlan() {
  return state.settings?.plan || 'free';
}

function checkLimit(type) {
  const plan = PLANS[getCurrentPlan()];
  if (!plan) return true;
  switch(type) {
    case 'product': return plan.maxProducts === -1 || state.products.length < plan.maxProducts;
    case 'record':  return plan.maxRecords  === -1 || state.customers.length < plan.maxRecords;
    case 'user':    return plan.maxUsers    === -1 || state.users.length < plan.maxUsers;
    case 'board':   return plan.maxBoards   === -1 || (state.kanban?.boards?.length || 0) < plan.maxBoards;
  }
  return true;
}

function planGate(type, onSuccess) {
  if (checkLimit(type)) { onSuccess(); return; }
  const plan = PLANS[getCurrentPlan()];
  const labels = { product:`商材数（上限${plan.maxProducts}）`, record:`データ件数（上限${plan.maxRecords}）`, user:`ユーザー数（上限${plan.maxUsers}）`, board:`カンバンボード数（上限${plan.maxBoards}）` };
  showModal('プランの上限に達しました', `
    <div style="text-align:center;padding:16px 0;">
      <div style="font-size:48px;margin-bottom:12px;">🔒</div>
      <div style="font-size:15px;font-weight:700;margin-bottom:8px;">${labels[type]}に達しています</div>
      <div style="font-size:13px;color:var(--text2);margin-bottom:20px;">プランをアップグレードすると制限が緩和されます</div>
      <button class="btn btn-primary" onclick="closeModal();navigate('plan')">プランを確認する</button>
    </div>`, [{ label:'閉じる', cls:'btn-secondary', action:closeModal }], 'modal-sm');
}
