function selectPlan(planKey) {
  if (planKey === 'enterprise') {
    showModal('Enterpriseプランのお問い合わせ', `
      <div style="text-align:center;padding:16px 0;">
        <div style="font-size:48px;margin-bottom:12px;">🏢</div>
        <div style="font-size:15px;font-weight:700;margin-bottom:8px;">Enterpriseプランについて</div>
        <div style="font-size:13px;color:var(--text2);margin-bottom:20px;line-height:1.8;">
          初期費用・月額・カスタマイズ範囲などはご要望に合わせて個別にご提案します。<br>
          下記メールアドレスまでお問い合わせください。
        </div>
        <div style="background:var(--accent-light);border-radius:8px;padding:12px 20px;display:inline-block;">
          <div style="font-size:14px;font-weight:700;color:var(--accent);">contact@flowdesk.jp</div>
        </div>
      </div>`, [{ label:'閉じる', cls:'btn-secondary', action:closeModal }], 'modal-sm');
    return;
  }
  const p = PLANS[planKey];
  const isFree = planKey === 'free';
  showModal(`${isFree ? 'ダウングレード' : 'アップグレード'}の確認`, `
    <div style="text-align:center;padding:16px 0;">
      <div style="font-size:40px;margin-bottom:12px;">${{ free:'🆓', starter:'⭐', business:'🚀' }[planKey]}</div>
      <div style="font-size:15px;font-weight:700;margin-bottom:8px;">${p.name}プランに変更</div>
      <div style="font-size:13px;color:var(--text2);margin-bottom:6px;">月額：${p.price === 0 ? '無料' : '¥'+p.price.toLocaleString()}</div>
      <div style="font-size:12px;color:var(--text3);margin-bottom:20px;">（デモ環境のため実際の課金は発生しません）</div>
      ${isFree ? `<div style="background:var(--warning-light);border:1px solid var(--warning);border-radius:8px;padding:10px;font-size:12px;color:var(--text2);margin-bottom:16px;">
        ⚠️ Freeプランでは商材${p.maxProducts}個・データ${p.maxRecords}件・ユーザー${p.maxUsers}名の制限があります
      </div>` : ''}
      <button class="btn btn-primary" onclick="confirmPlanChange('${planKey}')">変更する</button>
    </div>`, [{ label:'キャンセル', cls:'btn-secondary', action:closeModal }], 'modal-sm');
}

function confirmPlanChange(planKey) {
  state.settings = state.settings || {};
  state.settings.plan = planKey;
  saveState();
  closeModal();
  showToast(`${PLANS[planKey].name}プランに変更しました`, 'success');
  renderPlan();
}

function installTemplate(templateId) {
  const tmpl = INDUSTRY_TEMPLATES.find(t => t.id === templateId);
  if (!tmpl) return;

  showModal(`「${tmpl.name}」テンプレートを導入`, `
    <div style="text-align:center;padding:8px 0 16px;">
      <div style="font-size:48px;margin-bottom:8px;">${tmpl.icon}</div>
      <div style="font-size:15px;font-weight:700;margin-bottom:6px;">${tmpl.name}</div>
      <div style="font-size:13px;color:var(--text2);margin-bottom:16px;">${tmpl.desc}</div>
    </div>
    <div style="background:var(--surface2);border-radius:8px;padding:14px 16px;margin-bottom:16px;">
      <div style="font-size:12px;font-weight:700;color:var(--text2);margin-bottom:8px;">導入されるもの</div>
      <div style="font-size:12px;color:var(--text2);line-height:2;">
        ✅ 事業部「${tmpl.dept}」を作成<br>
        ${tmpl.products.map(p => `✅ 商材「${p.name}」（フォーム${p.formFields.length}項目・ステータス${p.statusValues.length}種類）`).join('<br>')}
      </div>
    </div>
    <p style="font-size:12px;color:var(--text3);">※ 既存のデータは変更されません。導入後すぐに使い始められます。</p>
  `, [
    { label: 'キャンセル', cls: 'btn-secondary', action: closeModal },
    { label: `導入する`, cls: 'btn-primary', action: () => executeInstallTemplate(templateId) }
  ], 'modal-md');
}

function executeInstallTemplate(templateId) {
  if (!checkLimit('product')) { planGate('product', ()=>{}); return; }

  const tmpl = INDUSTRY_TEMPLATES.find(t => t.id === templateId);
  if (!tmpl) return;

  // 事業部を作成（既存チェック）
  let dept = state.departments.find(d => d.name === tmpl.dept);
  if (!dept) {
    dept = { id: genId(), name: tmpl.dept };
    state.departments.push(dept);
  }

  // 商材を作成
  tmpl.products.forEach(p => {
    if (state.products.find(ep => ep.name === p.name && ep.deptId === dept.id)) return;
    state.products.push({
      id: genId(),
      name: p.name,
      deptId: dept.id,
      columnMapping: { ...p.columnMapping },
      aggSettings: { ...p.aggSettings },
      statusValues: [...p.statusValues],
      staffValues: [...p.staffValues],
      amtLabels: p.amtLabels ? [...p.amtLabels] : ['数値①','数値②'],
      numericCols: {},
      numericLabels: {},
      columns: [],
      formFields: p.formFields.map(f => ({ ...f, id: genId() })),
    });
  });

  saveState();
  renderSidebarDepts();
  closeModal();
  showToast(`「${tmpl.name}」テンプレートを導入しました！`, 'success');
  navigate('templates');
}

  if (!confirm('このユーザーを削除しますか？')) return;

  showToast('削除しました', 'success');
}

  showToast('設定を保存しました', 'success');

async function manualSync() {
  if (!_fbEnabled) { showToast('Firebase未設定です', 'error'); return; }
  showToast('同期中...', 'info');
  await saveStateFirebase();
  showToast('クラウドに同期しました ✅', 'success');
  const el = document.getElementById('last-sync-time');
  if (el) el.textContent = new Date().toLocaleTimeString('ja-JP');
}

async function checkFirebaseConnection() {
  if (!_fbEnabled) { showToast('Firebase未設定です', 'error'); return; }
  try {
    await saveStateFirebase();
    showToast('Firebase接続: 正常 ✅', 'success');
  } catch(e) {
    showToast('Firebase接続エラー: ' + e.message, 'error');
  }
}

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `flowdesk_backup_${new Date().toISOString().slice(0,10)}.json`; a.click();
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!confirm('現在のデータを上書きしますか？')) return;
      Object.assign(state, data);
      saveState(); location.reload();
    } catch { showToast('ファイルの読み込みに失敗しました', 'error'); }
  };
  reader.readAsText(file);
}

function resetAllData() {
  if (!confirm('全データを削除します。この操作は取り消せません。本当に実行しますか？')) return;
  const user = state.currentUser;
  Object.assign(state, JSON.parse(JSON.stringify(defaultState)));
  state.currentUser = user;
  saveState(); location.reload();
}

function openQRModal() {
  const url = `${window.location.origin}${window.location.pathname}?form=1`;
  showModal('入力フォームQRコード', `
    <p style="text-align:center;font-size:13px;color:var(--text2);margin-bottom:16px;">このQRコードをスキャンすると入力フォームが開きます</p>
    <div id="qr-display"></div>
    <p style="text-align:center;font-size:12px;color:var(--text3);margin-top:12px;word-break:break-all;">${url}</p>
  `, [{ label: '閉じる', cls: 'btn-secondary', action: closeModal }], 'modal-sm');
  setTimeout(() => {
    const container = document.getElementById('qr-display');
    if (container && typeof QRCode !== 'undefined') {
      new QRCode(container, { text: url, width: 200, height: 200, colorDark: '#1a1f2e', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
    } else if (container) {
      container.innerHTML = `<p style="text-align:center;color:var(--text3);">QRコード生成に失敗しました</p><p style="text-align:center;font-size:12px;">${url}</p>`;
    }
  }, 100);
}

// ============================================================
// MODAL HELPER
// ============================================================
// モーダルのaction関数を保持するグローバル配列
window._modalActions = [];

function showModal(title, bodyHtml, buttons = [], size = 'modal-md') {
  closeModal();
  window._modalActions = buttons.map(b => b.action);
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal ${size}" id="modal-box">
      <div class="modal-header">
        <div class="modal-title">${title}</div>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">${bodyHtml}</div>
      ${buttons.length ? `<div class="modal-footer">${buttons.map((b,i) => `<button class="btn ${b.cls}" onclick="window._modalActions[${i}]()">${b.label}</button>`).join('')}</div>` : ''}
    </div>`;
  document.body.appendChild(overlay);
}

function closeModal() {
  const el = document.getElementById('modal-overlay');
  if (el) el.remove();
}

// ============================================================
// TOAST
// ============================================================
function showToast(msg, type = 'info') {
  const icons = { success: '✅', error: '❌', info: 'ℹ️' };
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `<span>${icons[type]}</span><span>${escHtml(msg)}</span>`;
  document.getElementById('toast-container').appendChild(toast);
  setTimeout(() => toast.remove(), 3500);
}

// ============================================================
// UTILS
// ============================================================
function genId() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }
function escHtml(str) { return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ============================================================
// AUTO SYNC
// ============================================================
function startAutoSync() {
  const interval = state.settings?.syncInterval || 0;
  if (interval <= 0) return;
  setInterval(() => {
    state.products.filter(p => p.sheetId).forEach(p => syncSheet(p.id));
  }, interval * 60 * 1000);
}

// ============================================================
// STARTUP
// ============================================================
window.addEventListener('load', async () => {
  // Firebase初期化（非同期・失敗してもローカルで動く）
  await initFirebase();

  // 公開フォームモード
  const params = new URLSearchParams(window.location.search);
  if (params.has('form')) {
    document.getElementById('login-screen').style.display = 'none';
    document.body.style.background = 'linear-gradient(135deg,#f0f4ff 0%,#e8f0fe 100%)';
    document.body.style.minHeight = '100vh';
    document.getElementById('app').style.display = 'flex';
    state.currentUser = { id: 'form', name: 'フォームユーザー', role: 'input', avatar: 'F' };
    initApp();
    navigate('form-public');
    document.getElementById('sidebar').style.display = 'none';
    document.getElementById('header').style.background = 'linear-gradient(135deg,#1e3a8a,#2563eb)';
    document.getElementById('header-title').style.color = 'white';
    return;
  }

  // 通常ログインフロー
  if (state.currentUser) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    initApp();
    startAutoSync();

    // Firebase有効時：起動時にクラウドから最新データを取得
    if (_fbEnabled) {
      const companyId = state.settings?.companyId || 'default';
      const fbState = await loadStateFirebase(companyId);
      if (fbState) {
        Object.assign(state, fbState);
        saveStateLocal();
        renderSidebarDepts();
        updateSidebarUser();
        if (currentPage) navigate(currentPage, currentParams);
      }
    }
  }

  // Firebaseのオンライン状態をUIに表示
  if (_fbEnabled) {
    const syncBadge = document.createElement('div');
    syncBadge.id = 'sync-badge';
    syncBadge.style.cssText = 'position:fixed;bottom:16px;right:16px;background:var(--success);color:white;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;z-index:500;box-shadow:var(--shadow-md);';
    syncBadge.innerHTML = '☁️ クラウド同期中';
    document.body.appendChild(syncBadge);
  }
});
</script>
